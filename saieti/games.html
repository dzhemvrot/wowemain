<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Spēļu ģenerators – ledlauži, komandas veidošana, energizers un citas aktivitātes">
  <title>Spēļu ģenerators</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <h1 class="mb-0" id="page-title">Spēļu ģenerators</h1>
      <div class="d-flex align-items-center gap-2">
        <a href="browse.html" class="btn btn-outline-primary btn-sm" id="link-browse">📋 Katalogs</a>
        <div class="btn-group" role="group" aria-label="Language">
          <button type="button" class="btn btn-outline-dark btn-sm lang-btn active" data-lang="lv" id="btn-lv">LV</button>
          <button type="button" class="btn btn-outline-dark btn-sm lang-btn" data-lang="ru" id="btn-ru">RU</button>
        </div>
      </div>
    </div>

    <!-- Category selection -->
    <div id="category-view">
      <p class="lead mb-4" id="choose-text">Izvēlies kategoriju:</p>
      <div class="row g-3 justify-content-center" id="category-grid">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- Game view -->
    <div id="game-view" class="d-none">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h2 class="card-title mb-3" id="game-title"></h2>
          <div class="meta-row">
            <div class="meta-item">
              <strong id="label-people">Dalībnieku skaits</strong>
              <span id="game-people"></span>
            </div>
            <div class="meta-item">
              <strong id="label-duration">Ilgums</strong>
              <span id="game-duration"></span>
            </div>
            <div class="meta-item">
              <strong id="label-materials">Materiāli</strong>
              <span id="game-materials"></span>
            </div>
          </div>
          <hr>
          <p class="card-text" id="game-desc" style="white-space: pre-wrap;"></p>
          <div class="d-flex flex-wrap gap-2 mt-4">
            <button type="button" class="btn btn-outline-secondary btn-action" id="btn-back">← Atpakaļ</button>
            <button type="button" class="btn btn-primary btn-action" id="btn-reshuffle">🔄 Jauna spēle</button>
          </div>
        </div>
      </div>
      <p class="text-center text-muted mt-3 small" id="category-label"></p>
    </div>

    <!-- Empty category message -->
    <div id="empty-view" class="d-none text-center">
      <div class="card mx-auto" style="max-width: 480px;">
        <div class="card-body p-4">
          <p class="mb-3" id="empty-text">Šajā kategorijā pagaidām nav spēļu.</p>
          <button type="button" class="btn btn-outline-secondary" id="btn-empty-back">← Atpakaļ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="games-data.js"></script>
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
