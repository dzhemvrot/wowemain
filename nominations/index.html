<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nominācijas — organizatora panelis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container py-4 py-lg-5">
      <header class="mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <p class="eyebrow mb-1">Skolas nomināciju sistēma</p>
            <h1 class="page-title mb-0">Organizatora panelis</h1>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-outline-primary" id="btn-export-csv">Eksportēt CSV</button>
            <label class="btn btn-primary mb-0" for="roster-import-input">Importēt klases sarakstu</label>
            <input type="file" id="roster-import-input" accept=".csv,.xlsx,.xls,.txt" class="d-none" />
          </div>
        </div>
      </header>

      <div class="row g-4">
        <div class="col-lg-4">
          <section class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h2 class="h5 mb-0">Nominācijas</h2>
            </div>
            <div class="card-body">
              <form id="nomination-form" class="row g-3">
                <div class="col-12">
                  <label for="nomination-title" class="form-label">Nosaukums</label>
                  <input id="nomination-title" class="form-control" type="text" placeholder="Piemēram: Gada radošā dvēsele" required />
                </div>
                <div class="col-12">
                  <label for="nomination-description" class="form-label">Apraksts</label>
                  <textarea id="nomination-description" class="form-control" rows="3" placeholder="Īss apraksts vai kritērijs"></textarea>
                </div>
                <div class="col-12">
                  <button class="btn btn-primary w-100" type="submit">Pievienot nomināciju</button>
                </div>
              </form>
            </div>
          </section>

          <section class="card shadow-sm">
            <div class="card-header bg-white">
              <h2 class="h5 mb-0">Nomināciju saraksts</h2>
            </div>
            <div class="list-group list-group-flush" id="nomination-list"></div>
          </section>
        </div>

        <div class="col-lg-8">
          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
              <h2 class="h5 mb-0">Klasu saraksts</h2>
              <span class="badge text-bg-light" id="student-count-badge">0 skolēnu</span>
            </div>
            <div class="card-body">
              <div id="class-list" class="class-grid"></div>
            </div>
          </div>

          <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
              <h2 class="h5 mb-0">Pārskatīšana / moderācija</h2>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 submissions-table">
                  <thead>
                    <tr>
                      <th>Klase</th>
                      <th>Nominācija</th>
                      <th>Nominee</th>
                      <th>Vieta</th>
                      <th>Iemesls</th>
                      <th>Statuss</th>
                      <th class="text-end">Darbības</th>
                    </tr>
                  </thead>
                  <tbody id="submission-list"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="card shadow-sm mt-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h2 class="h5 mb-0">Rezultātu kopsavilkums</h2>
          <div class="d-flex gap-2 align-items-center">
            <label class="form-label small mb-0" for="result-filter-nomination">Nominācija</label>
            <select id="result-filter-nomination" class="form-select form-select-sm small-select"></select>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 results-table">
              <thead>
                <tr>
                  <th>Klase</th>
                  <th>Nominācija</th>
                  <th>Vērtējums</th>
                  <th>1. vieta</th>
                  <th>2. vieta</th>
                  <th>3. vieta</th>
                </tr>
              </thead>
              <tbody id="results-list"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
